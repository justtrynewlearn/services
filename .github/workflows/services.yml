name: Services

on:
  workflow_dispatch:

jobs:
  test-services:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        ports:
          - 5432:5432

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check PostgreSQL connection
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U testuser \
            -d testdb \
            -c "SELECT version();"

      - name: Check database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U testuser \
            -d testdb \
            -c "SELECT current_database();"
