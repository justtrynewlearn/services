name: Services

on:
  workflow_dispatch:

jobs:
  test-services:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools

      - name: Check PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U testuser \
            -d testdb \
            -c "SELECT version();"

      - name: Check Redis
        run: |
          redis-cli \
            -h localhost \
            -p 6379 \
            PING
